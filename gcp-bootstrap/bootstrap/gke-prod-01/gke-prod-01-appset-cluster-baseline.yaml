apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gke-prod-01-cluster-baseline
  namespace: argo-cd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - git:
      # TODO: Update this repoURL to the actual GitHub repository URL where this gcp-bootstrap is hosted
      repoURL: https://github.com/varunsoam007/GCP-Landding-Zone.git
      revision: HEAD
      directories:
      - path: gcp-bootstrap/apps/*/envs/gke-prod-01
  template:
    metadata:
      # This generates a name like 'gke-prod-01-external-secrets'
      name: '{{index .path.segments 4}}-{{index .path.segments 2}}'
    spec:
      project: default

      source:
        repoURL: https://github.com/varunsoam007/GCP-Landding-Zone.git
        targetRevision: HEAD
        path: '{{.path.path}}'

      destination:
        server: https://kubernetes.default.svc
        # The namespace is dynamically extracted from the app folder name (e.g., 'external-secrets')
        namespace: '{{index .path.segments 2}}'

      syncPolicy:
        syncOptions:
          - CreateNamespace=true
        automated:
          prune: true
          selfHeal: true
      
      revisionHistoryLimit: 2

#=============================================================================
# Ignore mutating changes injected by GKE and standard webhooks
#=============================================================================
      ignoreDifferences:
      # Ignore standard Cert-Manager webhook injections
      - group: admissionregistration.k8s.io
        kind: ValidatingWebhookConfiguration
        name: cert-manager-webhook
        jsonPointers:
        - /webhooks/0/namespaceSelector
        - /webhooks/0/objectSelector
      
      # Ignore dynamic GKE Autopilot or native annotations (if any are automatically added)
      - group: apps
        kind: Deployment
        jsonPointers:
        - /spec/template/metadata/annotations/seccomp.security.alpha.kubernetes.io~1pod
