name: Deploy GCP Landing Zone Infrastructure

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      runCheckov:
        description: 'Run Checkov Scan'
        required: true
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    # Pointing to the central pipeline template repo
    uses: varunsoam007/gcp-pipeline-template/.github/workflows/terraform-pipeline.yml@main
    with:
      workingDirectory: 'gcp-core-infrastructure'
      bucket: 'varunsoam007'
      prefix: 'terraform/state/core/prod'
      environment: 'prod'
      terraformVersion: '1.11.0'
      runCheckov: ${{ inputs.runCheckov == true }}
    secrets:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
