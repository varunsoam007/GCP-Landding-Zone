name: 'Terraform Init'
description: 'Initialize Terraform with GCP (GCS) Backend'
inputs:
  working_directory:
    description: 'Working directory'
    required: true
  bucket:
    description: 'GCS Bucket Name for Terraform State'
    required: true
  prefix:
    description: 'GCS Prefix (Path/Key) for Terraform State'
    required: true
  init_options:
    description: 'Additional init options'
    required: false
    default: '-reconfigure -input=false'

runs:
  using: "composite"
  steps:
    - name: Terraform Init
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        terraform init \
          -backend-config="bucket=${{ inputs.bucket }}" \
          -backend-config="prefix=${{ inputs.prefix }}" \
          ${{ inputs.init_options }}
